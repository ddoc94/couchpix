<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Blueprint palette: white card on cool blue-gray, electric blue accent. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7fa"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip cards to the phone screen so they peek behind the bezel -->
    <clipPath id="screen-clip">
      <rect x="55" y="42" width="110" height="216" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background with rounded corners (iOS masks its own) -->
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <!-- Subtle accent glow behind the logo -->
  <circle cx="512" cy="500" r="380" fill="url(#glow)"/>

  <!-- Phone, scaled & centered into the 1024 canvas -->
  <g transform="translate(277,182) scale(2.133)">
    <!-- Phone body -->
    <rect x="44" y="12" width="132" height="276" rx="30" fill="#ffffff" stroke="#2563eb" stroke-width="10"/>
    <!-- Screen -->
    <rect x="55" y="42" width="110" height="216" rx="14" fill="#f4f7fa"/>
    <!-- Earpiece + camera -->
    <rect x="98" y="27" width="24" height="4" rx="2" fill="#2563eb" opacity="0.55"/>
    <circle cx="130" cy="29" r="2.5" fill="#2563eb" opacity="0.55"/>
    <!-- Swipe cards clipped to the screen -->
    <g clip-path="url(#screen-clip)">
      <!-- Left peeking card — a movie (play) -->
      <g transform="translate(40,92) rotate(-7)">
        <rect width="54" height="150" rx="10" fill="#ffffff" stroke="#dde6ef" stroke-width="5"/>
        <polygon points="19,56 39,70 19,84" fill="#dde6ef"/>
      </g>
      <!-- Right peeking card — food (fork & knife) -->
      <g transform="translate(126,92) rotate(7)">
        <rect width="54" height="150" rx="10" fill="#ffffff" stroke="#dde6ef" stroke-width="5"/>
        <path d="M17,50 v9 M21,50 v9 M25,50 v9" stroke="#dde6ef" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M21,57 v29" stroke="#dde6ef" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M35,50 c5,3 5,13 0,16 z" fill="#dde6ef"/>
        <path d="M35,64 v22" stroke="#dde6ef" stroke-width="3.2" stroke-linecap="round"/>
      </g>
      <!-- Center card (the pick) — green check -->
      <g transform="translate(73,80)">
        <rect width="74" height="158" rx="13" fill="#ffffff" stroke="#059669" stroke-width="5"/>
        <path d="M22,72 l9,11 l21,-27" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="16" y="116" width="42" height="7" rx="3" fill="#64748b" opacity="0.5"/>
        <rect x="16" y="131" width="28" height="6" rx="3" fill="#64748b" opacity="0.35"/>
      </g>
    </g>
    <!-- Home indicator -->
    <rect x="94" y="270" width="32" height="5" rx="2.5" fill="#2563eb" opacity="0.45"/>
  </g>
</svg>
