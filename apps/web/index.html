<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Swipe right on movies everyone wants to watch. Group movie night decisions, made easy." />
    <meta name="theme-color" content="#f4f7fa" />

    <!-- Browser tab favicon (vector) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- PWA manifest — drives Android Chrome's "Add to Home Screen" prompt and icons -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS PWA: standalone fullscreen + icon + title under the home screen icon -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NetPix" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- Generic mobile web app meta (older Android Chrome) -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- OG / share previews -->
    <meta property="og:title" content="NetPix" />
    <meta property="og:description" content="Swipe right on movies everyone wants to watch." />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />

    <title>NetPix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
